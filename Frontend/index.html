<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B4F27" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- PWA Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="sBay" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="sBay - Ghana's premier campus marketplace. Buy and sell textbooks, electronics, fashion, and more. Made for Ghanaian students." />
    <meta name="keywords" content="campus marketplace, Ghana, student marketplace, buy sell textbooks, university marketplace, Legon marketplace" />
    <meta name="author" content="sBay" />
    <link rel="canonical" href="https://sbaygh.com/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sbaygh.com/" />
    <meta property="og:title" content="sBay — Campus Marketplace Reimagined" />
    <meta property="og:description" content="Ghana's premier campus marketplace. Buy and sell textbooks, electronics, fashion, and more." />
    <meta property="og:image" content="https://sbaygh.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://sbaygh.com/" />
    <meta property="twitter:title" content="sBay — Campus Marketplace Reimagined" />
    <meta property="twitter:description" content="Ghana's premier campus marketplace. Buy and sell textbooks, electronics, fashion, and more." />
    <meta property="twitter:image" content="https://sbaygh.com/og-image.jpg" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://sbay-backend.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://sbay-backend.onrender.com" />
    
    <!-- Non-render-blocking font loading -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" /></noscript>
    
    <!-- Structured Data for Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "sBay",
      "url": "https://sbaygh.com",
      "description": "Ghana's premier campus marketplace for students",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://sbaygh.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <title>sBay — Campus Marketplace Reimagined</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
